name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          # 11076708 is command-line tools 12.0, which the runner already has.
          # A newer version is a large download that fails the job when the connection resets.
          cmdline-tools-version: "11076708"
          packages: platform-tools

      - name: Prepare release keystore
        env:
          WHATSWEB_KEYSTORE_BASE64: ${{ secrets.WHATSWEB_KEYSTORE_BASE64 }}
          WHATSWEB_KEYSTORE_PASSWORD: ${{ secrets.WHATSWEB_KEYSTORE_PASSWORD }}
          WHATSWEB_KEY_ALIAS: ${{ secrets.WHATSWEB_KEY_ALIAS }}
          WHATSWEB_KEY_PASSWORD: ${{ secrets.WHATSWEB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in WHATSWEB_KEYSTORE_BASE64 WHATSWEB_KEYSTORE_PASSWORD WHATSWEB_KEY_ALIAS WHATSWEB_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "The release APK has to be signed with one keystore that is reused for every version. Android refuses an update signed with a different key."
            exit 1
          fi
          echo "$WHATSWEB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/whatsweb-release.jks"
          echo "WHATSWEB_KEYSTORE=$RUNNER_TEMP/whatsweb-release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          WHATSWEB_KEYSTORE_PASSWORD: ${{ secrets.WHATSWEB_KEYSTORE_PASSWORD }}
          WHATSWEB_KEY_ALIAS: ${{ secrets.WHATSWEB_KEY_ALIAS }}
          WHATSWEB_KEY_PASSWORD: ${{ secrets.WHATSWEB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew test lintRelease assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/whatsweb.apk"
          # Same versionName and versionCode. A second install, so the property
          # stays off the F-Droid and Play builds.
          ./gradlew assembleRelease -Pwhatsweb.gecko=true --no-daemon --rerun-tasks
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app/build/outputs/apk/release/app-${abi}-release.apk"
            if [ ! -f "$src" ]; then
              echo "Missing $src"
              exit 1
            fi
            cp "$src" "$RUNNER_TEMP/whatsweb-calls-${abi}.apk"
          done

      - name: Check tag matches versionName
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort | tail -n 1)"
          if [ -z "$aapt" ]; then
            echo "aapt was not found under $sdk/build-tools"
            exit 1
          fi
          check() {
            local apk="$1"
            local want_pkg="$2"
            local badging name pkg
            badging="$("$aapt" dump badging "$apk")"
            name="$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
            pkg="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            if [ "$name" != "$tag" ]; then
              echo "$apk versionName '$name' does not match tag v$tag"
              exit 1
            fi
            if [ "$pkg" != "$want_pkg" ]; then
              echo "$apk package '$pkg' is not $want_pkg"
              exit 1
            fi
          }
          check "$RUNNER_TEMP/whatsweb.apk" com.synalysis.whatsweb
          codes=""
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="$RUNNER_TEMP/whatsweb-calls-${abi}.apk"
            check "$apk" com.synalysis.whatsweb.gecko
            badging="$("$aapt" dump badging "$apk")"
            native="$(printf '%s\n' "$badging" | sed -n "s/native-code: '\([^']*\)'.*/\1/p")"
            code="$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
            if [ "$native" != "$abi" ]; then
              echo "$apk native-code '$native' is not $abi"
              exit 1
            fi
            codes="${codes}${code}"$'\n'
          done
          uniq_codes="$(printf '%s' "$codes" | sort -u | wc -l)"
          if [ "$uniq_codes" -ne 1 ]; then
            echo "Calls APKs do not share one versionCode"
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          apk="WhatsWeb-${version}.apk"
          cp "$RUNNER_TEMP/whatsweb.apk" "$apk"
          assets=("$apk")
          sums="$(printf '%s\n' "- \`${apk}\`: \`$(sha256sum "$apk" | cut -d' ' -f1)\`")"
          calls_list=""
          for abi in arm64-v8a armeabi-v7a x86_64; do
            calls="WhatsWeb-Calls-${version}-${abi}.apk"
            cp "$RUNNER_TEMP/whatsweb-calls-${abi}.apk" "$calls"
            assets+=("$calls")
            calls_list="${calls_list}- \`${calls}\`"$'\n'
            sums="${sums}"$'\n'"- \`${calls}\`: \`$(sha256sum "$calls" | cut -d' ' -f1)\`"
          done
          notes=$(printf '%s\n' \
            "Download \`${apk}\` or a WhatsWeb Calls APK from the assets below. All of them are version ${version}." \
            "" \
            "WhatsWeb Calls is a separate install with voice and video calls, alerts while the app is open, and screen sharing. Pick the file whose name matches the phone:" \
            "${calls_list%$'\n'}" \
            "" \
            "In [Obtainium](https://github.com/ImranR98/Obtainium), add https://github.com/synalysis/whatsweb twice. Give WhatsWeb the APK filter \`^WhatsWeb-[0-9].*\\.apk$\`. Give WhatsWeb Calls the filter \`^WhatsWeb-Calls-.*\\.apk$\` and turn on architecture filtering so it keeps the matching file." \
            "" \
            "SHA-256:" \
            "$sums" \
            "" \
            "These files are signed with the project's release key. An F-Droid package is signed separately, and Android will not replace one with the other.")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "WhatsWeb ${version}" --notes "$notes"
          else
            gh release create "$tag" "${assets[@]}" --title "WhatsWeb ${version}" --notes "$notes"
          fi
