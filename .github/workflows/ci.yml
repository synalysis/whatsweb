name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          # 11076708 is command-line tools 12.0, which the runner already has.
          # A newer version is a large download that fails the job when the connection resets.
          cmdline-tools-version: "11076708"
          packages: platform-tools

      - name: Test, lint, and assemble
        run: ./gradlew test lintDebug assembleDebug --no-daemon
